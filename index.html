
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#101914">
<title>SDON Messenger</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>

<style>
:root {
 --bg:#0b130f;
 --panel:rgba(25,43,33,.78);
 --panel2:rgba(32,54,42,.72);
 --green:#36d995;
 --green2:#9affca;
 --text:#edfff4;
 --muted:#9bb5a5;
 --border:rgba(160,255,200,.13);
 --danger:#ff7373;
}
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 background:
 radial-gradient(ellipse at 15% 10%,rgba(35,160,105,.18),transparent 45%),
 radial-gradient(ellipse at 90% 90%,rgba(32,110,75,.18),transparent 40%),
 var(--bg);
 color:var(--text);
 font-family:Inter,Arial,sans-serif;
}
button,input,textarea{font:inherit}
button{cursor:pointer}
.hidden{display:none!important}
.page{display:none;min-height:100vh}
.page.active{display:flex}
.glass{
 background:var(--panel);
 border:1px solid var(--border);
 box-shadow:0 15px 50px rgba(0,0,0,.25),inset 0 1px rgba(255,255,255,.04);
 backdrop-filter:blur(22px);
 -webkit-backdrop-filter:blur(22px);
}
button{
 color:var(--text);
 border:1px solid var(--border);
 background:rgba(255,255,255,.06);
 border-radius:13px;
 padding:11px 15px;
 transition:.2s;
}
button:hover{background:rgba(54,217,149,.15);border-color:var(--green)}
button.primary{
 background:linear-gradient(135deg,#25bd7d,#16895c);
 border:0;
 color:#041b10;
 font-weight:800;
}
button:disabled{opacity:.5;cursor:not-allowed}
input,textarea{
 color:var(--text);
 background:rgba(0,0,0,.2);
 border:1px solid var(--border);
 border-radius:13px;
 padding:13px 14px;
 outline:none;
 width:100%;
}
input:focus,textarea:focus{border-color:var(--green)}
input::placeholder,textarea::placeholder{color:#829b8b}
.logo{
 width:48px;height:48px;border-radius:16px;
 display:grid;place-items:center;
 background:linear-gradient(145deg,#36d995,#126d4a);
 color:#062316;font-size:25px;font-weight:900;
 box-shadow:0 5px 25px #24c98233;
}
.brand{display:flex;align-items:center;gap:12px;font-size:23px;font-weight:850;letter-spacing:1px}
.brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:2px;margin-top:3px}
.auth-wrap{width:100%;align-items:center;justify-content:center;padding:20px}
.auth-card{width:min(420px,100%);padding:30px;border-radius:27px}
.auth-card .brand{justify-content:center;margin-bottom:27px}
.auth-card h2{text-align:center;margin:0 0 8px}
.sub{text-align:center;color:var(--muted);font-size:14px;margin:0 0 24px}
.field{margin:13px 0}
.field label{display:block;font-size:13px;color:var(--muted);margin:0 0 7px}
.auth-card .primary{width:100%;margin-top:12px;padding:14px}
.switch{text-align:center;color:var(--muted);font-size:14px;margin-top:20px}
.switch a{color:var(--green2);cursor:pointer}
#toast{
 position:fixed;z-index:1000;bottom:22px;left:50%;
 transform:translate(-50%,20px);
 opacity:0;pointer-events:none;
 background:#1c3528;border:1px solid #42d99466;
 border-radius:14px;padding:13px 19px;
 box-shadow:0 10px 30px #0006;
 transition:.25s;max-width:90%;text-align:center;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
.app{width:100%;height:100vh;min-height:550px;padding:16px;gap:14px}
.sidebar{
 width:290px;flex-shrink:0;border-radius:23px;padding:20px;
 display:flex;flex-direction:column;gap:17px;
}
.side-profile{
 display:flex;align-items:center;gap:12px;padding:12px;
 border-radius:17px;background:rgba(255,255,255,.045);cursor:pointer;
}
.avatar{
 width:43px;height:43px;border-radius:50%;
 display:grid;place-items:center;overflow:hidden;flex-shrink:0;
 background:linear-gradient(135deg,#43e3a0,#176c4b);
 color:#052719;font-weight:900;
}
.avatar img{width:100%;height:100%;object-fit:cover}
.side-name{font-weight:700;overflow:hidden;text-overflow:ellipsis}
.side-handle{font-size:12px;color:var(--muted);margin-top:4px}
.nav{display:grid;gap:8px}
.nav button{text-align:left;padding:13px 15px}
.nav button.active{background:rgba(54,217,149,.15);border-color:#36d99566}
.sidebar-bottom{margin-top:auto;display:grid;gap:8px}
.main-panel{flex:1;min-width:0;border-radius:23px;overflow:hidden;display:flex;flex-direction:column}
.main-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px}
.main-header h2{margin:0;font-size:21px}
.main-content{padding:22px;overflow:auto;flex:1}
.search{margin-bottom:15px}
.user-list{display:grid;gap:9px}
.user-item{
 display:flex;align-items:center;gap:12px;
 padding:12px;border:1px solid var(--border);
 background:rgba(255,255,255,.035);border-radius:16px;
}
.user-item .user-info{flex:1;min-width:0}
.user-item strong{display:block;overflow:hidden;text-overflow:ellipsis}
.user-item small{color:var(--muted)}
.user-item button{white-space:nowrap}
.empty{color:var(--muted);text-align:center;padding:35px 15px}
.chat-page{width:100%;height:100vh;min-height:500px;padding:16px}
.chat-shell{width:min(100%,1000px);margin:auto;border-radius:23px;display:flex;flex-direction:column;overflow:hidden}
.chat-header{padding:15px 18px;display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--border)}
.chat-header .user-info{flex:1}
.chat-header strong{display:block}
.chat-header small{color:var(--muted)}
.messages{
 flex:1;min-height:0;overflow:auto;padding:18px;
 display:flex;flex-direction:column;gap:8px;
}
.message{
 max-width:min(78%,520px);padding:11px 14px;
 border-radius:16px;background:rgba(255,255,255,.075);
 overflow-wrap:anywhere;
}
.message.mine{align-self:flex-end;background:rgba(40,190,125,.2);border:1px solid #36d99533}
.message.theirs{align-self:flex-start}
.message img{max-width:100%;max-height:280px;border-radius:10px;display:block}
.message audio{max-width:100%}
.message-time{font-size:10px;color:var(--muted);display:block;text-align:right;margin-top:6px}
.composer{padding:13px;display:flex;align-items:center;gap:8px;border-top:1px solid var(--border)}
.composer input{flex:1;min-width:0}
.composer button{padding:12px}
#emojiPanel{padding:10px;border-top:1px solid var(--border);display:flex;gap:7px;flex-wrap:wrap}
#emojiPanel button{padding:7px 10px}
.profile-wrap{width:100%;align-items:center;justify-content:center;padding:20px}
.profile-card{width:min(440px,100%);padding:25px;border-radius:24px;text-align:center}
.profile-card .avatar{width:100px;height:100px;margin:15px auto;font-size:35px}
.profile-card h2{margin:10px}
.profile-card p{color:var(--muted)}
.profile-card input[type=file]{margin:15px 0}
.settings-card{max-width:600px;margin:auto;padding:22px;border-radius:20px}
.settings-card h3{margin-top:0}
.settings-card p{color:var(--muted);line-height:1.5}
.mobile-menu{display:none}
@media(max-width:760px){
 .app{padding:8px;gap:8px}
 .sidebar{width:70px;padding:10px;align-items:center}
 .sidebar .brand-text,.sidebar .side-info,.sidebar .nav-label,.sidebar .side-handle{display:none}
 .sidebar .brand{gap:0}
 .sidebar .logo{width:45px;height:45px}
 .side-profile{padding:5px;border:0;background:none}
 .sidebar .nav button{width:48px;height:48px;padding:0;text-align:center;font-size:18px}
 .sidebar .nav button span{display:none}
 .sidebar-bottom button{width:48px;height:45px;padding:0;font-size:17px}
 .main-header{padding:15px}
 .main-content{padding:13px}
 .chat-page{padding:6px}
 .chat-shell{height:calc(100vh - 12px)}
 .message{max-width:88%}
}
</style>
</head>

<body>

<div id="toast"></div>

<!-- ВХОД -->
<section id="authPage" class="page active auth-wrap">
 <div class="auth-card glass">
  <div class="brand">
   <div class="logo">•••</div>
   <div>SDON<small>MESSENGER</small></div>
  </div>
  <h2>С возвращением</h2>
  <p class="sub">Войди в свой аккаунт SDON</p>
  <form id="loginForm">
   <div class="field">
    <label>Email</label>
    <input id="loginEmail" type="email" placeholder="name@example.com" autocomplete="email" required>
   </div>
   <div class="field">
    <label>Пароль</label>
    <input id="loginPassword" type="password" placeholder="Твой пароль" autocomplete="current-password" required>
   </div>
   <button class="primary" type="submit" id="loginButton">Войти</button>
  </form>
  <div class="switch">Нет аккаунта? <a id="goRegister">Создать аккаунт</a></div>
 </div>
</section>

<!-- РЕГИСТРАЦИЯ -->
<section id="registerPage" class="page auth-wrap">
 <div class="auth-card glass">
  <div class="brand">
   <div class="logo">•••</div>
   <div>SDON<small>MESSENGER</small></div>
  </div>
  <h2>Создать аккаунт</h2>
  <p class="sub">Присоединяйся к SDON</p>
  <form id="registerForm">
   <div class="field">
    <label>Имя пользователя</label>
    <input id="registerName" type="text" placeholder="Например, Alex" minlength="3" maxlength="24" required>
   </div>
   <div class="field">
    <label>Уникальный @username</label>
    <input id="registerUsername" type="text" placeholder="alex_123" minlength="3" maxlength="24" required>
   </div>
   <div class="field">
    <label>Email</label>
    <input id="registerEmail" type="email" placeholder="name@example.com" autocomplete="email" required>
   </div>
   <div class="field">
    <label>Пароль</label>
    <input id="registerPassword" type="password" placeholder="Минимум 6 символов" minlength="6" required>
   </div>
   <div class="field">
    <label>Повтори пароль</label>
    <input id="registerPassword2" type="password" placeholder="Повтори пароль" minlength="6" required>
   </div>
   <button class="primary" type="submit" id="registerButton">Зарегистрироваться</button>
  </form>
  <div class="switch">Уже есть аккаунт? <a id="goLogin">Войти</a></div>
 </div>
</section>

<!-- ОСНОВНОЕ ПРИЛОЖЕНИЕ -->
<section id="appPage" class="page app">
 <aside class="sidebar glass">
  <div class="brand">
   <div class="logo">•••</div>
   <div class="brand-text">SDON<small>MESSENGER</small></div>
  </div>

  <div class="side-profile" id="openProfile">
   <div class="avatar" id="sideAvatar">S</div>
   <div class="side-info">
    <div class="side-name" id="sideName">Пользователь</div>
    <div class="side-handle" id="sideHandle">@username</div>
   </div>
  </div>

  <nav class="nav">
   <button class="active" data-section="chats">💬 <span>Чаты</span></button>
   <button data-section="contacts">👥 <span>Контакты</span></button>
   <button data-section="search">🔎 <span>Поиск</span></button>
   <button data-section="settings">⚙️ <span>Настройки</span></button>
   <button data-section="support">❔ <span>Помощь</span></button>
  </nav>

  <div class="sidebar-bottom">
   <button id="logoutButton">↪ <span class="nav-label">Выйти</span></button>
  </div>
 </aside>

 <main class="main-panel glass">
  <header class="main-header">
   <h2 id="sectionTitle">Чаты</h2>
   <div id="headerHint" style="color:var(--muted);font-size:12px">SDON Messenger</div>
  </header>
  <div class="main-content" id="mainContent"></div>
 </main>
</section>

<!-- ЧАТ -->
<section id="chatPage" class="page chat-page">
 <div class="chat-shell glass">
  <header class="chat-header">
   <button id="backToApp">←</button>
   <div class="avatar" id="chatAvatar">S</div>
   <div class="user-info">
    <strong id="chatUserName">Пользователь</strong>
    <small id="chatUserHandle">@username</small>
   </div>
  </header>
  <div class="messages" id="messagesContainer"></div>
  <div id="emojiPanel" class="hidden">
   <button type="button">😀</button><button type="button">😂</button>
   <button type="button">❤️</button><button type="button">🔥</button>
   <button type="button">👍</button><button type="button">🥰</button>
   <button type="button">😎</button><button type="button">😭</button>
   <button type="button">🎉</button><button type="button">🤔</button>
  </div>
  <form class="composer" id="messageForm">
   <button type="button" id="emojiButton" title="Эмодзи">☺</button>
   <button type="button" id="photoButton" title="Фото">＋</button>
   <input id="photoInput" type="file" accept="image/*" class="hidden">
   <input id="messageInput" type="text" placeholder="Написать сообщение..." autocomplete="off">
   <button type="button" id="voiceButton" title="Голосовое сообщение">🎙</button>
   <button class="primary" type="submit">➤</button>
  </form>
 </div>
</section>

<!-- ПРОФИЛЬ -->
<section id="profilePage" class="page profile-wrap">
 <div class="profile-card glass">
  <button id="profileBack" style="float:left">← Назад</button>
  <div style="clear:both"></div>
  <div class="avatar" id="profileAvatar">S</div>
  <h2 id="profileDisplayName">Пользователь</h2>
  <p id="profileUsername">@username</p>
  <input id="avatarInput" type="file" accept="image/*">
  <button id="saveAvatarButton" class="primary">Загрузить аватарку</button>
  <p id="profileEmail"></p>
 </div>
</section>

<script>
// ========================================
// SDON MESSENGER
// ========================================

// Firebase configuration
const firebaseConfig = {
 apiKey: "AIzaSyBb1_LtWZThcdDaJVq-BqQjP8O663LQwXU",
 authDomain: "sdon-messenger.firebaseapp.com",
 databaseURL: "https://sdon-messenger-default-rtdb.firebaseio.com",
 projectId: "sdon-messenger",
 storageBucket: "sdon-messenger.firebasestorage.app",
 messagingSenderId: "129529395194",
 appId: "1:129529395194:web:3333eb1360b6f8f0f1d643"
};

firebase.initializeApp(firebaseConfig);

const auth = firebase.auth();
const db = firebase.database();
const storage = firebase.storage();

const $ = id => document.getElementById(id);

let currentUser = null;
let currentProfile = null;
let currentChatUser = null;
let messagesRef = null;
let messagesCallback = null;
let recording = false;
let mediaRecorder = null;
let audioChunks = [];
let currentSection = "chats";

function toast(message) {
 const el = $("toast");
 el.textContent = message;
 el.classList.add("show");
 clearTimeout(toast.timer);
 toast.timer = setTimeout(() => el.classList.remove("show"), 3200);
}

function setPage(id) {
 document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
 $(id).classList.add("active");
}

function setBusy(button, busy, text) {
 if (!button) return;
 button.disabled = busy;
 if (busy) {
  button.dataset.oldText = button.textContent;
  button.textContent = text || "Подожди...";
 } else {
  button.textContent = button.dataset.oldText || button.textContent;
 }
}

function friendlyError(error) {
 console.error(error);
 const messages = {
  "auth/email-already-in-use":"Этот Email уже зарегистрирован",
  "auth/invalid-email":"Неверный Email",
  "auth/weak-password":"Пароль слишком простой",
  "auth/user-not-found":"Аккаунт не найден",
  "auth/wrong-password":"Неверный пароль",
  "auth/invalid-credential":"Неверный Email или пароль",
  "auth/too-many-requests":"Слишком много попыток. Попробуй позже",
  "auth/network-request-failed":"Проблема с интернетом",
  "PERMISSION_DENIED":"Firebase запретил доступ. Проверь правила базы",
  "storage/unauthorized":"Firebase Storage запретил загрузку"
 };
 toast(messages[error.code] || error.message || "Произошла ошибка");
}

function normalizeUsername(value) {
 return value.trim().toLowerCase().replace(/^@/,"").replace(/[^a-z0-9_]/g,"");
}

function showAuth(which) {
 setPage(which === "register" ? "registerPage" : "authPage");
}

// ========================================
// REGISTRATION
// ========================================

$("goRegister").addEventListener("click", () => showAuth("register"));
$("goLogin").addEventListener("click", () => showAuth("login"));

$("registerForm").addEventListener("submit", async event => {
 event.preventDefault();

 const name = $("registerName").value.trim();
 const username = normalizeUsername($("registerUsername").value);
 const email = $("registerEmail").value.trim();
 const password = $("registerPassword").value;
 const password2 = $("registerPassword2").value;
 const button = $("registerButton");

 if (name.length < 2) return toast("Имя слишком короткое");
 if (username.length < 3) return toast("Ник должен быть минимум 3 символа");
 if (!/^[a-z0-9_]+$/.test(username)) return toast("В нике допустимы латинские буквы, цифры и _");
 if (password.length < 6) return toast("Пароль должен быть минимум 6 символов");
 if (password !== password2) return toast("Пароли не совпадают");

 setBusy(button,true,"Создаю аккаунт...");

 let createdUser = null;
 let reservedUsername = false;

 try {
  // Сначала создаём пользователя через Firebase Authentication.
  const credential = await auth.createUserWithEmailAndPassword(email,password);
  createdUser = credential.user;

  // Атомарно резервируем уникальный ник.
  const usernameRef = db.ref("usernames/" + username);
  const result = await usernameRef.transaction(oldValue => {
   if (oldValue === null || oldValue === createdUser.uid) {
    return createdUser.uid;
   }
   return;
  });

  if (!result.committed) {
   await createdUser.delete();
   createdUser = null;
   throw new Error("Этот @username уже занят");
  }

  reservedUsername = true;

  const profile = {
   uid: createdUser.uid,
   displayName: name,
   username: username,
   email: email,
   avatar: "",
   createdAt: Date.now()
  };

  await db.ref("users/" + createdUser.uid).set(profile);
  currentUser = createdUser;
  currentProfile = profile;

  $("registerForm").reset();
  await showApplication();
  toast("Аккаунт SDON создан!");

 } catch (error) {
  if (createdUser && !reservedUsername) {
   try { await createdUser.delete(); } catch (_) {}
  }
  if (error.message === "Этот @username уже занят") {
   toast(error.message);
  } else {
   friendlyError(error);
  }
 } finally {
  setBusy(button,false);
 }
});

// ========================================
// LOGIN
// ========================================

$("loginForm").addEventListener("submit", async event => {
 event.preventDefault();

 const email = $("loginEmail").value.trim();
 const password = $("loginPassword").value;
 const button = $("loginButton");

 if (!email || !password) return toast("Заполни Email и пароль");

 setBusy(button,true,"Вхожу...");

 try {
  const credential = await auth.signInWithEmailAndPassword(email,password);
  currentUser = credential.user;
  await showApplication();
  $("loginForm").reset();
  toast("С возвращением!");
 } catch (error) {
  friendlyError(error);
 } finally {
  setBusy(button,false);
 }
});

// ========================================
// AUTH STATE AND PROFILE
// ========================================

auth.onAuthStateChanged(async user => {
 if (user) {
  currentUser = user;
  try {
   await showApplication();
  } catch (error) {
   friendlyError(error);
  }
 } else {
  currentUser = null;
  currentProfile = null;
  stopMessagesListener();
  setPage("authPage");
 }
});

async function showApplication() {
 if (!currentUser) return;

 const snapshot = await db.ref("users/" + currentUser.uid).once("value");
 currentProfile = snapshot.val();

 if (!currentProfile) {
  currentProfile = {
   uid: currentUser.uid,
   displayName: currentUser.email.split("@")[0],
   username: currentUser.email.split("@")[0].replace(/[^a-z0-9_]/gi,""),
   email: currentUser.email,
   avatar: ""
  };
  await db.ref("users/" + currentUser.uid).set(currentProfile);
 }

 renderProfile();
 setPage("appPage");
 await showSection("chats");
}

function renderAvatar(element, url, fallback) {
 element.replaceChildren();

 if (url) {
  const img = document.createElement("img");
  img.src = url;
  img.alt = "Аватар";
  element.appendChild(img);
 } else {
  element.textContent = fallback || "S";
 }
}

function renderProfile() {
 if (!currentProfile) return;

 $("sideName").textContent = currentProfile.displayName || "Пользователь";
 $("sideHandle").textContent = "@" + (currentProfile.username || "user");
 rend
